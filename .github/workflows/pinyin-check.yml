name: Validate offline pinyin
on:
  push:
    branches: [main, keyboard-041]
    paths:
      - ios/Shared/PinyinEngine.swift
      - ios/Shared/pinyin-lexicon.json
      - ios/Shared/pinyin-costs.json
      - ios/Shared/pinyin-syllables.json
      - ios/Shared/VoiceResultDelivery.swift
      - scripts/PinyinSmoke.swift
      - .github/workflows/pinyin-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinyin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinyin:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise real Swift engine
        run: |
          mkdir -p build
          swiftc -O -parse-as-library ios/Shared/PinyinEngine.swift ios/Shared/VoiceResultDelivery.swift scripts/PinyinSmoke.swift -o build/pinyin-smoke
          build/pinyin-smoke ios/Shared/pinyin-lexicon.json
