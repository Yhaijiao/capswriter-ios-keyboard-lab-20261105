name: Build iPhone keyboard for sideloading
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: capswriter-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and bridge behavior
        run: |
          python3 -B scripts/check_sources.py
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m venv "$RUNNER_TEMP/cw-bridge-venv"
          "$RUNNER_TEMP/cw-bridge-venv/bin/pip" install -r bridge/requirements.txt
          "$RUNNER_TEMP/cw-bridge-venv/bin/python" -B -m unittest discover -s bridge -p 'test_*.py' -v
      - name: Check toolchain
        run: |
          SELECTED_XCODE=$(python3 -c 'import glob,re; paths=[(tuple(map(int,m.group(1).split("."))),p) for p in glob.glob("/Applications/Xcode_*.app") if (m:=re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$",p))]; print(max(paths)[1]+"/Contents/Developer" if paths else "")')
          if [ -n "$SELECTED_XCODE" ]; then
            export DEVELOPER_DIR="$SELECTED_XCODE"
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test bundled offline pinyin
        run: |
          mkdir -p build
          swiftc -parse-as-library ios/Shared/PinyinEngine.swift ios/Shared/VoiceResultDelivery.swift scripts/PinyinSmoke.swift -o build/pinyin-smoke
          build/pinyin-smoke ios/Shared/pinyin-lexicon.json
          swiftc -parse-as-library ios/Shared/BridgeEndpoint.swift scripts/EndpointSmoke.swift -o build/endpoint-smoke
          build/endpoint-smoke
      - name: Generate project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build for physical iPhone
        run: |
          set -o pipefail
          xcodebuild -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build | tee build-device.log
      - name: Package IPA with shared-keychain signing template
        run: |
          set -o pipefail
          APP=artifacts/Payload/CapsWriterLab.app
          KEYBOARD="$APP/PlugIns/CapsWriterKeyboard.appex"
          ACTIVITY="$APP/PlugIns/CapsWriterVoiceActivity.appex"
          mkdir -p artifacts/Payload
          ditto build/device/Build/Products/Release-iphoneos/CapsWriterLab.app "$APP"
          test -d "$KEYBOARD"
          test -d "$ACTIVITY"
          codesign --force --sign - "$ACTIVITY"
          sed 's/$(AppIdentifierPrefix)/CAPSWTEST0./g' ios/App/CapsWriterLab.entitlements > build/sideload.entitlements
          for BUNDLE in "$KEYBOARD" "$APP"; do
            codesign --force --sign - --generate-entitlement-der --entitlements build/sideload.entitlements "$BUNDLE"
            codesign --display --entitlements - --xml "$BUNDLE" > build/sideload-observed.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' build/sideload-observed.plist)" = CAPSWTEST0.org.capswriterlab.voice-pairings
          done
          codesign --verify --deep --strict "$APP"
          cd artifacts
          zip -qr CapsWriterLab-0.4.12-sideload.ipa Payload
          shasum -a 256 CapsWriterLab-0.4.12-sideload.ipa > SHA256SUMS.txt
          rm -r Payload
      - name: Verify package
        run: python3 scripts/verify_ipa.py artifacts/CapsWriterLab-0.4.12-sideload.ipa 0.4.12
      - name: Upload install package before simulator tests
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriterLab-IPA
          path: |
            artifacts/*.ipa
            artifacts/SHA256SUMS.txt
          retention-days: 14
      - name: Build simulator and take screenshot
        run: |
          set -o pipefail
          xcodebuild -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build | tee build-simulator.log
          IOS_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          xcrun simctl list runtimes available --json > build/simulator-runtimes.json
          RUNTIME_ID=$(python3 scripts/select_simulator_runtime.py --sdk "$IOS_SDK" --json-file build/simulator-runtimes.json)
          DEVICE_ID=$(xcrun simctl create CapsWriter-QA 'iPhone 15 Pro Max' "$RUNTIME_ID")
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Debug-iphonesimulator/CapsWriterLab.app
          xcrun simctl launch "$DEVICE_ID" org.capswriterlab.keyboard
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/app-simulator.png
          echo "$DEVICE_ID" > build/simulator-device-id.txt
      - name: Validate keyboard construction and row alignment
        timeout-minutes: 10
        run: |
          set -o pipefail
          DEVICE_ID=$(cat build/simulator-device-id.txt)
          TEST_RESULT=0
          xcodebuild test -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/simulator -resultBundlePath artifacts/KeyboardLayoutTests.xcresult \
            -parallel-testing-enabled NO -only-testing:KeyboardLayoutTests \
            CODE_SIGNING_ALLOWED=NO | tee test-keyboard-layout.log || TEST_RESULT=$?
          echo "$TEST_RESULT" > artifacts/keyboard-layout-test-exit-code.txt
          xcrun xcresulttool export attachments --path artifacts/KeyboardLayoutTests.xcresult \
            --output-path artifacts/layout-test-attachments || true
          exit "$TEST_RESULT"
      - name: Upload keyboard layout validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriterLab-LayoutValidation
          path: |
            artifacts/keyboard-layout-test-exit-code.txt
            artifacts/layout-test-attachments/
            test-keyboard-layout.log
          retention-days: 14
      - name: Exercise real keyboard in simulator
        timeout-minutes: 22
        run: |
          set -o pipefail
          DEVICE_ID=$(cat build/simulator-device-id.txt)
          TEST_RESULT=0
          xcodebuild test -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/simulator -resultBundlePath artifacts/KeyboardSmokeTests.xcresult \
            -parallel-testing-enabled NO -only-testing:KeyboardSmokeTests \
            CODE_SIGNING_ALLOWED=NO | tee test-simulator.log || TEST_RESULT=$?
          echo "$TEST_RESULT" > artifacts/simulator-ui-test-exit-code.txt
          xcrun xcresulttool export attachments --path artifacts/KeyboardSmokeTests.xcresult \
            --output-path artifacts/keyboard-test-attachments || true
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/after-ui-test.png || true
          xcrun simctl spawn "$DEVICE_ID" log show --last 20m --style compact \
            --predicate 'process == "CapsWriterKeyboard" OR process == "CapsWriterLab"' \
            > artifacts/keyboard-runtime.log || true
          xcrun simctl shutdown "$DEVICE_ID"
          exit "$TEST_RESULT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CapsWriterLab-iPhone
          path: |
            artifacts/*.ipa
            artifacts/SHA256SUMS.txt
            artifacts/*.png
            artifacts/*exit-code.txt
            artifacts/keyboard-runtime.log
            artifacts/keyboard-test-attachments/
            artifacts/layout-test-attachments/
            test-keyboard-layout.log
            build-device.log
            build-simulator.log
            test-simulator.log
          retention-days: 14
