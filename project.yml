name: CapsWriterKeyboard
options:
  bundleIdPrefix: org.capswriterlab
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.4.12'
    CURRENT_PROJECT_VERSION: '25'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CapsWriterLab:
    type: application
    platform: iOS
    sources:
      - path: ios/App
      - path: ios/IntentShared
      - path: ios/Shared
    entitlements:
      path: ios/App/CapsWriterLab.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)org.capswriterlab.voice-pairings']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.capswriterlab.keyboard
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CAPSWRITER_CONTAINING_APP"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios/App/Info.plist
      properties:
        CFBundleDisplayName: CapsWriter Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: org.capswriterlab.pairing
            CFBundleURLSchemes: [capswriterlab]
        NSMicrophoneUsageDescription: 在你主动开启的限时语音会话中采集声音，按你的选择在本机或配对服务识别。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 连接你自己的电脑，获取热词版本并测试同一套纠错算法。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    dependencies:
      - target: CapsWriterKeyboard
        embed: true
      - target: CapsWriterVoiceActivity
        embed: true
  CapsWriterKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Keyboard
      - path: ios/IntentShared
      - path: ios/Shared
    entitlements:
      path: ios/Keyboard/CapsWriterKeyboard.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)org.capswriterlab.voice-pairings']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.capswriterlab.keyboard.extension
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: ios/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: CapsWriter Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: 从你自己的电脑获取热词版本和纠错结果。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
  CapsWriterVoiceActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/VoiceActivity
      - path: ios/IntentShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.capswriterlab.keyboard.activity
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: ios/VoiceActivity/Info.plist
      properties:
        CFBundleDisplayName: Voice Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KeyboardLayoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/LayoutTests
      - path: ios/Keyboard
      - path: ios/IntentShared
      - path: ios/Shared
    dependencies:
      - target: CapsWriterLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.capswriterlab.keyboard.layouttests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CapsWriterLab.app/CapsWriterLab
        BUNDLE_LOADER: $(TEST_HOST)
  KeyboardSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/UITests
    dependencies:
      - target: CapsWriterLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.capswriterlab.keyboard.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CapsWriterLab
schemes:
  CapsWriterLab:
    build:
      targets:
        CapsWriterLab: all
        CapsWriterKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: KeyboardLayoutTests
        - name: KeyboardSmokeTests
    archive:
      config: Release
